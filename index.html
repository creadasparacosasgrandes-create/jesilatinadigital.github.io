<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jesi Delvalle — Tu Mentora Cristiana e Infoproductora con Propósito">
<title>Jesi Delvalle — Blessed Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  :root {
    --cream:      #FAF7F2;
    --ivory:      #F3EDE0;
    --champagne:  #E8DCC8;
    --tan:        #C9B896;
    --gold:       #B8945A;
    --gold-light: #D4AF72;
    --text:       #3D2E1E;
    --text-mid:   #6B5540;
    --text-muted: #9A8470;
    --white:      #FFFFFF;
  }

  html, body {
    min-height: 100%;
    background: var(--cream);
    font-family: 'Lato', sans-serif;
  }

  /* ── FONDO GENERAL ── */
  body {
    background-color: var(--cream);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,180,150,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(184,148,90,0.10) 0%, transparent 60%);
  }

  /* ── CONTENEDOR PRINCIPAL ── */
  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
    position: relative;
  }

  /* ── HERO FOTO ── */
  .hero {
    width: 100%;
    position: relative;
    overflow: hidden;
    height: 520px;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    display: block;
  }

  /* Degradado desde abajo sobre la foto */
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      transparent 45%,
      rgba(250,247,242,0.6) 70%,
      var(--cream) 100%
    );
  }

  /* ── ÁREA DE TEXTO PRINCIPAL ── */
  .intro {
    width: 100%;
    padding: 0 32px;
    text-align: center;
    margin-top: -48px;
    position: relative;
    z-index: 10;
  }

  .intro .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.1s forwards;
  }

  .intro h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 42px;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.25s forwards;
  }

  .intro h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .intro .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--text-mid);
    line-height: 1.5;
    margin-top: 12px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  /* Línea decorativa */
  .divider {
    width: 48px;
    height: 1px;
    background: var(--gold);
    opacity: 0.6;
    margin: 22px auto;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.55s forwards;
  }

  /* ── BOTONES ── */
  .links {
    width: 100%;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 17px 24px;
    text-align: center;
    text-decoration: none;
    border-radius: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    letter-spacing: 0.12em;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(184,148,90,0.08);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }
  .btn:hover::before {
    transform: translateX(0);
  }

  /* Botón primario — dorado */
  .btn-primary {
    background: var(--text);
    color: var(--champagne);
    border: 1px solid var(--text);
    animation: fadeUp 0.7s ease calc(0.6s + var(--i) * 0.1s) forwards;
  }
  .btn-primary:hover {
    background: var(--text-mid);
    color: var(--ivory);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(61,46,30,0.15);
  }

  /* Botón outline */
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--tan);
    animation: fadeUp 0.7s ease calc(0.6s + var(--i) * 0.1s) forwards;
  }
  .btn-outline:hover {
    background: var(--ivory);
    border-color: var(--gold);
    color: var(--text);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(184,148,90,0.12);
  }

  /* Botón gold especial */
  .btn-gold {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--white);
    border: none;
    animation: fadeUp 0.7s ease calc(0.6s + var(--i) * 0.1s) forwards;
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(184,148,90,0.3);
    filter: brightness(1.05);
  }

  /* Ícono dentro del botón */
  .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* ── LABEL DE SECCIÓN ── */
  .section-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    margin: 28px 0 16px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.9s forwards;
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 44px;
    text-align: center;
    opacity: 0;
    animation: fadeIn 1s ease 1.2s forwards;
  }

  .footer .handle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  .footer .crown {
    font-size: 20px;
    display: block;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  /* Elemento floral decorativo SVG pequeño */
  .floral-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 6px 0 24px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.6s forwards;
  }
  .floral-divider .line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--tan));
  }
  .floral-divider .line.right {
    background: linear-gradient(to left, transparent, var(--tan));
  }
  .floral-divider .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.7;
  }

  /* ── ANIMACIONES ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 400px) {
    .intro h1 { font-size: 36px; }
    .hero { height: 460px; }
    .btn { font-size: 16px; padding: 15px 20px; }
  }
</style>
</head>
